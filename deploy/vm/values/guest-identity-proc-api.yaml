image: { repository: guest-identity-proc-api, tag: vm, pullPolicy: Never }
imagePullSecrets: []
# Reached inside the cluster only (callers use the gateway). No direct port on the server.
service: { type: ClusterIP }
autoscaling: { enabled: false }
replicas: 1
serviceMonitor: { enabled: false }
networkPolicy: { enabled: false }
ingress: { enabled: false }
resources:
  requests: { cpu: 100m, memory: 384Mi }
  limits: { cpu: "2", memory: 768Mi }
