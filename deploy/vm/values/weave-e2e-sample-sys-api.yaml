image: { repository: weave-e2e-sample-sys-api, tag: vm, pullPolicy: Never }
imagePullSecrets: []
service: { type: NodePort, nodePort: 30188 }   # deliberately a NodePort: the target deploy must override it
autoscaling: { enabled: false }
replicas: 1
serviceMonitor: { enabled: false }
networkPolicy: { enabled: false }
podDisruptionBudget: { minAvailable: 0 }
ingress: { enabled: false }
resources:
  requests: { cpu: 20m, memory: 128Mi }
  limits: { cpu: "500m", memory: 512Mi }
